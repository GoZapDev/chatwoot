name: Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "Arquivo VERSION vazio ou ausente."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão: v${VERSION}"

      - name: Normalizar nome da imagem
        id: image
        run: |
          IMAGE_NAME_LOWER="$(printf '%s' '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Criar tag Git
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG já existe — pulando criação."
            exit 0
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.arch }} e push
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            docker buildx build \
              --file docker/Dockerfile \
              --platform '${{ matrix.platform }}' \
              --push \
              --tag "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}" \
              .

  manifest:
    name: Publish multi-arch image
    needs: [prepare, build]
    runs-on: ubuntu-24.04

    steps:
      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Criar manifesto multi-arch
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}" \
            "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64" \
            "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-arm64"
