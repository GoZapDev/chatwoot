name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ vars.DOCKER_PASSWORD }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VERSION" ]; then
            echo "Arquivo VERSION vazio ou ausente."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão: v${VERSION}"

      - name: Validar credenciais do registry
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "DOCKER_USERNAME ou DOCKER_PASSWORD não configurados."
            echo ""
            echo "Configure em Settings → Secrets and variables → Actions → Variables:"
            echo "  DOCKER_USERNAME  (ex.: adfastltda)"
            echo "  DOCKER_PASSWORD  (PAT com write:packages)"
            echo "  DOCKER_REGISTRY  (opcional, padrão: ghcr.io)"
            exit 1
          fi

      - name: Criar tag Git
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG já existe — pulando criação."
            exit 0
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch e push
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              --tag "${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ github.event.repository.name }}:v${{ steps.version.outputs.version }}" \
              .
